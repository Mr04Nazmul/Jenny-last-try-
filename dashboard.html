<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAZU | Dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;background:#070914;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh}nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6%;border-bottom:1px solid #202638;background:rgba(7,9,20,.75);backdrop-filter:blur(16px)}.logo{font-size:24px;font-weight:850;letter-spacing:2px}main{width:min(900px,92%);margin:45px auto}.welcome{margin-bottom:25px}.muted{color:#9aa6bb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:rgba(13,19,32,.8);border:1px solid #252d40;border-radius:18px;padding:24px;box-shadow:0 15px 45px rgba(0,0,0,.2)}.label{color:#8e9ab0;font-size:13px;margin-bottom:9px}.value{font-size:25px;font-weight:700;word-break:break-word}button{padding:11px 17px;border:1px solid #30394e;border-radius:9px;background:#fff;color:#070b14;font-weight:700;cursor:pointer}#state{padding:16px;border-radius:12px;background:#101827;margin-bottom:18px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><nav><div class="logo">NAZU</div><button onclick="logout()">Sign out</button></nav><main><div class="welcome"><h1>Welcome to NAZU</h1><p class="muted">Your account dashboard</p></div><div id="state">Checking your account...</div><div class="grid"><div class="card"><div class="label">EMAIL</div><div class="value" id="email">—</div></div><div class="card"><div class="label">POINTS</div><div class="value" id="points">0</div></div><div class="card"><div class="label">ACCOUNT</div><div class="value">Active</div></div></div></main>
<script>
const SUPABASE_URL="https://vjygltfnrmyghlwyjtwu.supabase.co",SUPABASE_KEY="sb_publishable_SL6n4Q0t_AxHywHM6iMkpg_bm-lx_Oh";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),state=document.getElementById("state");
async function load(){try{const {data,error}=await supabaseClient.auth.getUser();if(error||!data.user){window.location.replace("login.html");return}document.getElementById("email").textContent=data.user.email||"—";state.textContent="Account connected successfully."}catch(e){state.textContent="Could not load your account.";}}
async function logout(){await supabaseClient.auth.signOut();window.location.replace("login.html")}
load();
</script></body></html>
