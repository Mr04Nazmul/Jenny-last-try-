<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAZU | Dashboard</title><style>body{margin:0;background:#070b14;color:#fff;font-family:Arial,sans-serif;padding:25px}.card{max-width:700px;margin:40px auto;padding:28px;border:1px solid #252d40;border-radius:18px;background:#0d1320}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#18233a;color:#9dbbff;font-size:12px}button{padding:11px 16px;border:0;border-radius:9px;margin-top:18px}</style></head><body><div class="card"><span class="tag">NAZU ACCOUNT</span><h1>Dashboard</h1><p id="status">Loading account...</p><p>Points: <b id="points">—</b></p><p id="error"></p><button onclick="logout()">Sign out</button></div><script>const API="https://jenny-last-try.onrender.com";const token=localStorage.getItem("nazu_token");const statusEl=document.getElementById("status"),pointsEl=document.getElementById("points"),errorEl=document.getElementById("error");async function load(){if(!token){location.href="login.html";return}try{const r=await fetch(API+"/api/me",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok)throw Error(d.message||"Session expired");statusEl.textContent="Signed in as "+d.user.email;pointsEl.textContent=d.user.points}catch(e){statusEl.textContent="Unable to load account";errorEl.textContent=e.message}}function logout(){localStorage.removeItem("nazu_token");location.href="login.html"}load();</script></body></html>
