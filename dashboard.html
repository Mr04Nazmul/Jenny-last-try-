<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAZU | Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6%;border-bottom:1px solid #202638}.logo{font-size:24px;font-weight:800;letter-spacing:2px}
main{width:min(900px,92%);margin:45px auto}.welcome{margin-bottom:25px}.muted{color:#9aa6bb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#0d1320;border:1px solid #252d40;border-radius:18px;padding:24px}.label{color:#8e9ab0;font-size:13px;margin-bottom:9px}.value{font-size:25px;font-weight:700;word-break:break-word}
button{padding:11px 17px;border:1px solid #30394e;border-radius:9px;background:#fff;color:#070b14;font-weight:700}
#state{padding:16px;border-radius:12px;background:#101827;margin-bottom:18px}
</style>
</head>
<body>
<nav><div class="logo">NAZU</div><button onclick="logout()">Sign out</button></nav>
<main>
<div class="welcome"><h1>Welcome to NAZU</h1><p class="muted">Your account dashboard</p></div>
<div id="state">Checking your account...</div>
<div class="grid">
<div class="card"><div class="label">EMAIL</div><div class="value" id="email">—</div></div>
<div class="card"><div class="label">POINTS</div><div class="value" id="points">0</div></div>
<div class="card"><div class="label">ACCOUNT</div><div class="value">Active</div></div>
</div>
</main>
<script>
const API="https://jenny-last-try.onrender.com";
const token=localStorage.getItem("nazu_token");
const state=document.getElementById("state");
async function load(){
 if(!token){window.location.replace("login.html");return}
 try{
  const r=await fetch(API+"/api/me",{headers:{Authorization:"Bearer "+token}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.message||"Your session has expired.");
  document.getElementById("email").textContent=d.user.email;
  document.getElementById("points").textContent=d.user.points;
  state.textContent="Account connected successfully.";
 }catch(e){
  state.textContent="Could not connect to your account. Please sign in again.";
  setTimeout(()=>{localStorage.removeItem("nazu_token");window.location.replace("login.html")},1800);
 }
}
function logout(){localStorage.removeItem("nazu_token");window.location.replace("login.html")}
load();
</script>
</body>
</html>
