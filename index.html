<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="NAZU — the next generation Web3 network.">
<meta name="theme-color" content="#020817">
<title>NAZU — Join the Network</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#01030a;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:#01030a url("nazu-world.svg") center top/cover no-repeat}
body:after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(0,4,13,.08),rgba(0,5,18,.04) 42%,rgba(0,3,12,.45) 100%)}
.page{width:min(760px,92%);margin:auto;min-height:100vh;position:relative}
.top{height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.powered,.network-label{font-size:8px;line-height:1.55;letter-spacing:3px;color:#a9c9ef;text-transform:uppercase;text-shadow:0 0 14px #36a9ff}
.powered{display:flex;align-items:center;gap:11px}
.solana{width:28px;height:18px;position:relative;filter:drop-shadow(0 0 7px #45b8ff)}
.solana i{position:absolute;left:0;width:25px;height:5px;border-radius:2px;transform:skewX(-28deg);background:linear-gradient(90deg,#19b7ff,#8b52ff)}
.solana i:nth-child(1){top:0}.solana i:nth-child(2){top:7px;background:linear-gradient(90deg,#8b52ff,#d7faff)}.solana i:nth-child(3){top:14px;background:linear-gradient(90deg,#1cbcff,#8b52ff)}
.top-actions{display:flex;align-items:center;gap:10px}.enter-link{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;border:1px solid rgba(92,180,255,.7);border-radius:999px;background:rgba(3,16,38,.58);color:#dcecff;text-decoration:none;font-size:9px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;box-shadow:0 0 22px rgba(45,150,255,.12);backdrop-filter:blur(10px)}.enter-link:hover{border-color:#8ed6ff;box-shadow:0 0 26px rgba(45,150,255,.24)}.network-label{text-align:right;max-width:155px}
.hero{padding:42px 0 28px;text-align:center}
.eyebrow{font-size:8px;letter-spacing:4px;color:#a8d0fa;text-transform:uppercase}
.logo-title{font-size:clamp(76px,17vw,132px);line-height:.82;font-weight:1000;letter-spacing:-7px;margin:32px 0 10px;text-shadow:0 0 22px rgba(120,190,255,.35),0 0 60px rgba(45,120,255,.18)}
.tag{font-size:10px;letter-spacing:7px;color:#a9cdf2;text-transform:uppercase;text-shadow:0 0 14px #2d9cff}
.card{margin:40px auto 0;padding:28px;max-width:660px;border:1px solid rgba(83,178,255,.78);border-radius:27px;background:linear-gradient(145deg,rgba(3,14,37,.94),rgba(2,10,29,.90));box-shadow:0 25px 90px rgba(0,0,0,.5),0 0 45px rgba(39,125,255,.22),inset 0 0 35px rgba(40,160,255,.06);backdrop-filter:blur(12px);text-align:left}
.ref{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(76,174,255,.8);border-radius:999px;padding:9px 15px;background:rgba(4,27,58,.75);color:#a9c9ef;font-size:13px}
.ref .dot{width:9px;height:9px;border-radius:50%;background:#aee1ff;box-shadow:0 0 12px #54baff}
.ref b{color:#fff}
h1{font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-1.8px;margin:28px 0 13px}
h1 span{background:linear-gradient(90deg,#fff,#8a55ff,#19c1ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{font-size:15px;line-height:1.65;color:#9db5d8;margin:0 0 24px;max-width:590px}
.field{height:61px;border:1px solid rgba(86,120,170,.7);border-radius:15px;background:rgba(5,19,43,.72);display:flex;align-items:center;padding:0 18px}
.field-icon{font-size:20px;color:#9bb8da}.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:inherit;font-size:15px;margin-left:12px}.field input::placeholder{color:#7186a6}
.check{display:flex;gap:13px;align-items:flex-start;color:#9aafcd;font-size:13px;line-height:1.5;margin:20px 0 22px;cursor:pointer}
.check input{appearance:none;width:19px;height:19px;flex:0 0 19px;border-radius:5px;border:1px solid #5c789e;background:#071426;margin:0}.check input:checked{background:linear-gradient(135deg,#744bff,#18baff);box-shadow:0 0 15px #38aaff66}
.status{min-height:18px;margin-top:13px;text-align:center;color:#91a9c9;font-size:12px;line-height:1.45}.cta{width:100%;height:58px;border:0;border-radius:14px;background:linear-gradient(100deg,#7042ff,#5479ff 53%,#13baff);color:#fff;font-size:17px;font-weight:850;box-shadow:0 15px 38px rgba(38,136,255,.34);cursor:pointer}
.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:27px 4px 34px;color:#9ab0cc;font-size:10px}.footer b{letter-spacing:5px;color:#fff}
@media(max-width:600px){.page{width:92%}.top{height:74px}.top-actions{gap:7px}.enter-link{height:31px;padding:0 10px;font-size:8px;letter-spacing:1.2px}.network-label{font-size:7px}.hero{padding-top:28px}.logo-title{font-size:23vw;letter-spacing:-5px;margin-top:29px}.tag{letter-spacing:5px}.card{margin-top:34px;padding:22px;border-radius:24px}.footer{padding-bottom:24px}}
@media(min-width:900px){.hero{padding-top:60px}.card{padding:34px}}
</style>
<style id="auth-modal-style">
.auth-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,3,12,.72);backdrop-filter:blur(14px)}
.auth-modal.open{display:flex}
.auth-shell{position:relative;width:min(470px,100%);height:min(760px,calc(100vh - 28px));border:1px solid rgba(100,180,255,.35);border-radius:28px;overflow:hidden;background:#02050c;box-shadow:0 30px 100px rgba(0,0,0,.7),0 0 50px rgba(50,130,255,.16)}
.auth-shell iframe{width:100%;height:100%;border:0;display:block}
.auth-close{position:absolute;right:12px;top:12px;z-index:3;width:34px;height:34px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(3,10,22,.78);color:#fff;font-size:20px;line-height:1;cursor:pointer}
@media(max-width:520px){.auth-modal{padding:0}.auth-shell{width:100%;height:100%;border-radius:0;border:0}.auth-close{right:10px;top:10px}}
</style>
</head>
<body>
<div class="page">
<header class="top">
<div class="powered"><span class="solana"><i></i><i></i><i></i></span><span>POWERED BY<br>SOLANA</span></div>
<div class="top-actions"><a class="enter-link" href="login.html" id="openAuth">Sign in / Create account</a><div class="network-label">THE NEXT<br>GENERATION<br>WEB3 NETWORK</div></div>
</header>
<main class="hero">
<div class="eyebrow">WEB3 NETWORK · BUILT TOWARD SOLANA</div>
<div class="logo-title">NAZU</div>
<div class="tag">BUILD · CONNECT · GROW</div>

<footer class="footer"><b>NAZU</b><span>Secure account access · Solana layer next</span></footer>
<div class="auth-modal" id="authModal" aria-hidden="true">
<div class="auth-shell">
<button class="auth-close" id="closeAuth" type="button" aria-label="Close">×</button>
<iframe src="login.html" title="NAZU account access"></iframe>
</div>
</div>
</main>
</div>
<script>
const SUPABASE_URL="https://vjygltfnrmyghlwyjtwu.supabase.co";
const SUPABASE_KEY="sb_publishable_SL6n4Q0t_AxHywHM6iMkpg_bm-lx_Oh";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const emailInput=document.getElementById("email");
const updates=document.getElementById("updates");
const enter=document.getElementById("enter");
const status=document.getElementById("status");

enter.addEventListener("click",async()=>{
  const email=emailInput.value.trim();
  status.textContent="";
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    status.textContent="Please enter a valid email address.";
    emailInput.focus();
    return;
  }
  if(!updates.checked){
    status.textContent="Please confirm that you want to receive network information.";
    return;
  }
  enter.disabled=true;
  enter.textContent="Sending…";
  try{
    const redirectTo="https://mr04nazmul.github.io/nazulabs/login.html?verified=1";
    const {error}=await supabaseClient.auth.signInWithOtp({
      email,
      options:{
        shouldCreateUser:true,
        emailRedirectTo:redirectTo
      }
    });
    if(error) throw error;
    status.textContent="Verification email sent. Open the link in your inbox to continue. Your account is not activated until the email is verified.";
    enter.textContent="Code sent";
  }catch(error){
    status.textContent=error?.message||"Could not send the verification email. Please try again.";
    enter.disabled=false;
    enter.textContent="Send verification";
  }
});
</script>
<script>
const openAuth=document.getElementById("openAuth"),authModal=document.getElementById("authModal"),closeAuth=document.getElementById("closeAuth");
function showAuth(e){if(e)e.preventDefault();authModal.classList.add("open");authModal.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
function hideAuth(){authModal.classList.remove("open");authModal.setAttribute("aria-hidden","true");document.body.style.overflow=""}
openAuth.addEventListener("click",showAuth);closeAuth.addEventListener("click",hideAuth);
authModal.addEventListener("click",e=>{if(e.target===authModal)hideAuth()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&authModal.classList.contains("open"))hideAuth()});
</script>
</body>
</html>
