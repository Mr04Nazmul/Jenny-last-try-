<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="NAZU — the next generation Web3 network.">
<meta name="theme-color" content="#020817">
<title>NAZU — Join the Network</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#01040c;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:#01040c url("nazu-world.svg") center top/cover no-repeat}
body:after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(0,4,14,.04),rgba(0,5,18,.02) 45%,rgba(0,3,12,.48) 100%)}
.page{width:min(760px,92%);margin:auto;min-height:100vh;position:relative;padding-bottom:32px}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 3px}
.brand{display:flex;align-items:center;gap:10px}.brand-mark{font-size:31px;font-weight:1000;line-height:1;background:linear-gradient(135deg,#49a9ff,#fff 45%,#9e5cff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(56,160,255,.4)}.brand-name{font-size:16px;font-weight:800;letter-spacing:6px}
.build{font-size:8px;letter-spacing:3.5px;color:#d0ddf4;text-transform:uppercase;text-align:right;text-shadow:0 0 12px #328cff}
.hero{padding:25px 0 0;text-align:center}
.eyebrow{display:none}
.logo-title{font-size:clamp(76px,16vw,128px);line-height:.82;font-weight:1000;letter-spacing:-7px;margin:0 0 10px;text-shadow:0 0 22px rgba(150,210,255,.42),0 0 65px rgba(45,120,255,.3)}
.tag{font-size:9px;letter-spacing:6px;color:#c3d6f1;text-transform:uppercase;text-shadow:0 0 13px #2d9cff}
.account-panel{width:min(600px,100%);margin:66px auto 0;padding:0 0 25px;border:1px solid rgba(83,178,255,.72);border-radius:27px;background:linear-gradient(145deg,rgba(3,14,37,.92),rgba(2,8,25,.88));box-shadow:0 25px 90px rgba(0,0,0,.55),0 0 45px rgba(39,125,255,.22),inset 0 0 35px rgba(40,160,255,.05);backdrop-filter:blur(14px);overflow:hidden}
.account-tabs{display:grid;grid-template-columns:1fr 1fr;margin:0 66px;border-bottom:1px solid rgba(112,146,194,.22)}
.account-tab{height:68px;border:0;background:transparent!important;color:#aabbd5;font-size:16px;font-weight:500;cursor:pointer;box-shadow:none!important;border-radius:0!important;position:relative}
.account-tab.active{color:#fff}.account-tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;border-radius:4px;background:linear-gradient(90deg,#16baff,#7545ff);box-shadow:0 0 16px rgba(90,100,255,.72)}
.account-inner{padding:35px 50px 0}.account-inner h2{font-size:31px;letter-spacing:-1.2px;margin:0 0 10px}.account-sub{margin:0 0 24px;color:#a0b4d2;font-size:15px;line-height:1.5}
.account-inner label{display:block;color:#b8c8df;font-size:10px;font-weight:700;letter-spacing:.05em;margin:0 0 7px}
.account-inner input[type=email],.account-inner input[type=password],.account-inner input[type=text]{width:100%;height:53px;padding:0 16px;border:1px solid rgba(81,125,177,.7);border-radius:13px;background:rgba(5,18,42,.72);color:#fff;outline:none;font:inherit;font-size:15px;margin:0 0 15px}
.account-inner input:focus{border-color:#6cbdff;box-shadow:0 0 0 4px rgba(91,160,255,.1)}
.account-names{display:grid;grid-template-columns:1fr 1fr;gap:11px}.account-names input{min-width:0}
.account-submit{width:100%;height:57px;border:0;border-radius:13px;background:linear-gradient(100deg,#733fff,#596dff 53%,#16baff);color:#fff;font-size:17px;font-weight:850;cursor:pointer;box-shadow:0 15px 38px rgba(39,124,255,.3)}
.account-submit:disabled{opacity:.6;cursor:wait}
.account-links{display:flex;justify-content:space-between;gap:12px;margin-top:17px;color:#a879ff;font-size:12px}.account-link{cursor:pointer}.account-msg{min-height:20px;margin-top:12px;text-align:center;color:#98abc7;font-size:12px;line-height:1.45}.account-ok{color:#8dffd0!important}
.account-back{margin-top:15px;text-align:center;color:#aab7d0;font-size:12px;cursor:pointer}.account-hidden{display:none!important}
.footer{display:none}
@media(max-width:600px){
 .page{width:92%;padding-bottom:20px}.top{height:62px}.brand-mark{font-size:27px}.brand-name{font-size:14px;letter-spacing:5px}.build{font-size:7px;letter-spacing:2.4px}
 .hero{padding-top:24px}.logo-title{font-size:22vw;letter-spacing:-5px}.tag{font-size:8px;letter-spacing:4.8px}
 .account-panel{margin-top:65px;border-radius:23px}.account-tabs{margin:0 24px}.account-inner{padding:29px 25px 0}.account-inner h2{font-size:28px}.account-names{grid-template-columns:1fr}
}
@media(min-width:900px){.hero{padding-top:38px}.account-panel{margin-top:78px}}
</style>

<style id="account-panel-style">
.account-panel{width:min(520px,100%);margin:48px auto 0;padding:0 0 25px;border:1px solid rgba(83,178,255,.7);border-radius:27px;background:linear-gradient(145deg,rgba(3,14,37,.94),rgba(2,10,29,.9));box-shadow:0 25px 90px rgba(0,0,0,.55),0 0 45px rgba(39,125,255,.2),inset 0 0 35px rgba(40,160,255,.05);backdrop-filter:blur(16px);overflow:hidden}
.account-tabs{display:grid;grid-template-columns:1fr 1fr;margin:0 36px;border-bottom:1px solid rgba(112,146,194,.25)}
.account-tab{height:64px;border:0;background:transparent!important;color:#9db4d5;font-size:15px;font-weight:650;cursor:pointer;box-shadow:none!important;border-radius:0!important;position:relative}
.account-tab.active{color:#fff}.account-tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:4px;background:linear-gradient(90deg,#18baff,#7044ff);box-shadow:0 0 16px rgba(90,100,255,.7)}
.account-inner{padding:29px 36px 0}.account-inner h2{font-size:29px;letter-spacing:-1px;margin:0 0 8px}.account-sub{margin:0 0 21px;color:#94a9c7;font-size:13px;line-height:1.55}
.account-inner label{display:block;color:#b9c9df;font-size:10px;font-weight:800;letter-spacing:.1em;margin:0 0 7px}
.account-inner input[type=email],.account-inner input[type=password],.account-inner input[type=text]{width:100%;height:52px;padding:0 15px;border:1px solid rgba(81,125,177,.62);border-radius:13px;background:rgba(5,18,42,.76);color:#fff;outline:none;font:inherit;font-size:14px;margin:0 0 15px}
.account-inner input:focus{border-color:#6c6dff;box-shadow:0 0 0 4px rgba(91,100,255,.1)}
.account-names{display:grid;grid-template-columns:1fr 1fr;gap:11px}.account-names input{min-width:0}
.account-submit{width:100%;height:54px;border:0;border-radius:13px;background:linear-gradient(100deg,#733fff,#536dff 53%,#12b9ff);color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 15px 38px rgba(39,124,255,.3)}
.account-submit:disabled{opacity:.6;cursor:wait}
.account-links{display:flex;justify-content:space-between;gap:12px;margin-top:16px;color:#a879ff;font-size:12px}.account-link{cursor:pointer}.account-msg{min-height:20px;margin-top:12px;text-align:center;color:#98abc7;font-size:12px;line-height:1.45}.account-ok{color:#8dffd0!important}
.account-back{margin-top:15px;text-align:center;color:#aab7d0;font-size:12px;cursor:pointer}
.account-hidden{display:none!important}
@media(max-width:600px){.account-panel{margin-top:35px;border-radius:23px}.account-tabs{margin:0 24px}.account-inner{padding:26px 24px 0}.account-names{grid-template-columns:1fr}.account-inner h2{font-size:27px}}
</style>
</head>
<body>
<div class="page">
<header class="top">
  <div class="brand"><div class="brand-mark">N</div><div class="brand-name">NAZU</div></div>
  <div class="build">BUILD · CONNECT · GROW</div>
</header>
<main class="hero">
  <div class="logo-title">NAZU</div>
  <div class="tag">BUILD · CONNECT · GROW</div>
<section class="account-panel" id="account-panel" aria-label="NAZU account access">
