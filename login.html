<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAZU | Account</title>
<style>
body{margin:0;background:#070b14;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{width:min(390px,90%);padding:28px;border:1px solid #252d40;border-radius:18px;background:#0d1320}
input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0 14px;border-radius:9px;border:1px solid #30394e;background:#070b14;color:#fff}
button{width:100%;padding:14px;border:0;border-radius:9px;font-weight:bold}
.switch{display:block;text-align:center;margin-top:18px;color:#9dbbff;cursor:pointer}
#msg{margin-top:14px;color:#aab4c5;font-size:13px}
</style>
</head>
<body>
<div class="box">
<h2>NAZU</h2>
<p id="subtitle">Sign in to your account</p>
<form id="form">
<label>Email</label>
<input id="email" type="email" required autocomplete="email">
<label>Password</label>
<input id="password" type="password" minlength="8" required autocomplete="current-password">
<button id="submit" type="submit">Sign in</button>
</form>
<div id="msg"></div>
<span class="switch" id="switch">Create an account</span>
</div>
<script>
const API="https://jenny-last-try.onrender.com";
const form=document.getElementById("form");
const email=document.getElementById("email");
const password=document.getElementById("password");
const msg=document.getElementById("msg");
const subtitle=document.getElementById("subtitle");
const submit=document.getElementById("submit");
const sw=document.getElementById("switch");
let registerMode=false;

sw.onclick=function(){
 registerMode=!registerMode;
 subtitle.textContent=registerMode?"Create your account":"Sign in to your account";
 submit.textContent=registerMode?"Create account":"Sign in";
 sw.textContent=registerMode?"Already have an account? Sign in":"Create an account";
 msg.textContent="";
};

async function api(path){
 const response=await fetch(API+path,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({email:email.value.trim(),password:password.value})
 });
 const data=await response.json().catch(function(){return {};});
 if(!response.ok) throw new Error(data.message||("Request failed ("+response.status+")"));
 return data;
}

form.onsubmit=async function(event){
 event.preventDefault();
 submit.disabled=true;
 msg.textContent=registerMode?"Creating account...":"Signing in...";
 try{
  if(registerMode){
   await api("/api/register");
   const login=await api("/api/login");
   localStorage.setItem("nazu_token",login.token);
  }else{
   const login=await api("/api/login");
   localStorage.setItem("nazu_token",login.token);
  }
  window.location.replace("dashboard.html?v=6");
 }catch(error){
  msg.textContent=(error&&error.message)?error.message:"Unable to connect to the server. Please try again.";
 }finally{
  submit.disabled=false;
 }
};
</script>
</body>
</html>
