<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAZU | Account</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#050711}
body:before,body:after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none}body:before{background:#6c4cff;top:-130px;left:-110px}body:after{background:#00d9ff;right:-140px;bottom:-150px}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,rgba(96,72,255,.12),transparent 35%),linear-gradient(135deg,#050711,#080b17 55%,#050711);pointer-events:none}.grid{position:fixed;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:42px 42px}
.box{position:relative;width:min(410px,calc(100% - 32px));padding:32px 28px 26px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:rgba(12,15,29,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 24px 80px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.08);animation:up .65s ease}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:25px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#8d6cff,#4d9dff);box-shadow:0 0 28px rgba(104,90,255,.38)}.brand{font-size:21px;font-weight:850;letter-spacing:.08em}.badge{margin-left:auto;padding:6px 9px;border:1px solid rgba(92,255,194,.2);border-radius:999px;color:#83ffc9;font-size:10px;text-transform:uppercase;background:rgba(76,255,188,.06)}
h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}.sub{margin:0 0 25px;color:#9299ae;font-size:14px;line-height:1.5}label{display:block;margin:0 0 8px;color:#b8bfd0;font-size:12px;font-weight:700;letter-spacing:.04em}input{width:100%;padding:14px 15px;margin:0 0 17px;border-radius:13px;border:1px solid #252b42;outline:none;background:rgba(5,8,18,.72);color:#fff;font-size:15px}input:focus{border-color:#7561ff;box-shadow:0 0 0 4px rgba(117,97,255,.11)}
button{width:100%;padding:15px;border:0;border-radius:13px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(100deg,#735cff,#4d91ff);box-shadow:0 10px 28px rgba(91,75,255,.25)}button:disabled{opacity:.65;cursor:wait}.switch{display:block;text-align:center;margin-top:19px;color:#a9b5ff;font-size:13px;cursor:pointer}#msg{min-height:18px;margin-top:13px;text-align:center;color:#929bb1;font-size:12px;line-height:1.4}.footer{text-align:center;margin-top:23px;color:#50586d;font-size:10px;letter-spacing:.08em;text-transform:uppercase}@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:420px){.box{padding:27px 21px 23px;border-radius:22px}.badge{display:none}h1{font-size:25px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div class="bg"></div><div class="grid"></div><div class="box">
<div class="logo"><div class="mark">N</div><div class="brand">NAZU</div><div class="badge">Beta</div></div>
<h1 id="title">Welcome back</h1><p class="sub" id="subtitle">Sign in to continue to your NAZU account.</p>
<form id="form"><label for="email">EMAIL</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">PASSWORD</label><input id="password" type="password" minlength="8" required autocomplete="current-password" placeholder="••••••••"><button id="submit" type="submit">Sign in</button></form>
<div id="msg"></div><span class="switch" id="switch">Create an account</span><div class="footer">NAZU · Build the future</div>
</div>
<script>
const SUPABASE_URL="https://vjygltfnrmyghlwyjtwu.supabase.co";
const SUPABASE_KEY="sb_publishable_SL6n4Q0t_AxHywHM6iMkpg_bm-lx_Oh";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById("form"),email=document.getElementById("email"),password=document.getElementById("password"),msg=document.getElementById("msg"),subtitle=document.getElementById("subtitle"),title=document.getElementById("title"),submit=document.getElementById("submit"),sw=document.getElementById("switch");let registerMode=false;
supabaseClient.auth.getSession().then(({data})=>{if(data.session)window.location.replace("dashboard.html?v=9")});
sw.onclick=()=>{registerMode=!registerMode;title.textContent=registerMode?"Create your account":"Welcome back";subtitle.textContent=registerMode?"Join NAZU and start your journey.":"Sign in to continue to your NAZU account.";submit.textContent=registerMode?"Create account":"Sign in";sw.textContent=registerMode?"Already have an account? Sign in":"Create an account";msg.textContent=""};
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;msg.textContent=registerMode?"Creating account...":"Signing in...";
try{const result=registerMode?await supabaseClient.auth.signUp({email:email.value.trim(),password:password.value}):await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(result.error)throw result.error;if(registerMode&&!result.data.session){msg.textContent="Account created. Please sign in.";registerMode=false;title.textContent="Welcome back";subtitle.textContent="Sign in to continue to your NAZU account.";submit.textContent="Sign in";sw.textContent="Create an account";return}window.location.replace("dashboard.html?v=9")}catch(error){msg.textContent=error?.message||"Unable to sign in. Please try again."}finally{submit.disabled=false}};
</script></body></html>
