<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAZU | Sign in</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
body{min-height:100vh;display:grid;place-items:center;background:#02050c;overflow:auto}
.bg{position:fixed;inset:0;background:url("nazu-login-world.svg") center/cover no-repeat}.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,3,10,.12),rgba(0,3,10,.58)),radial-gradient(ellipse at center,transparent 15%,rgba(0,0,0,.4));}
.card{position:relative;width:min(430px,calc(100% - 30px));margin:24px 0;padding:30px 27px 24px;border:1px solid rgba(255,255,255,.14);border-radius:25px;background:rgba(5,12,27,.82);backdrop-filter:blur(24px);box-shadow:0 25px 80px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:25px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#8064ff,#3d9cff);box-shadow:0 0 28px rgba(90,120,255,.35)}.brand{font-weight:850;font-size:21px;letter-spacing:.08em}.pill{margin-left:auto;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#87ffd0;border:1px solid rgba(87,255,196,.22);padding:6px 9px;border-radius:99px}
h1{margin:0 0 8px;font-size:29px;letter-spacing:-.04em}.sub{margin:0 0 24px;color:#94a4bd;font-size:14px;line-height:1.5}
label{display:block;margin:0 0 7px;color:#b8c4d9;font-size:11px;font-weight:750;letter-spacing:.06em}input{width:100%;padding:14px 15px;margin:0 0 16px;border-radius:13px;border:1px solid #2a3750;outline:none;background:rgba(3,8,18,.78);color:#fff;font-size:15px}input:focus{border-color:#7561ff;box-shadow:0 0 0 4px rgba(117,97,255,.11)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:11px}.names input{min-width:0}
button{width:100%;height:52px;border:0;border-radius:13px;color:#fff;font-size:14px;font-weight:850;cursor:pointer;background:linear-gradient(100deg,#704dff,#4c91ff,#16baff);box-shadow:0 12px 30px rgba(66,104,255,.25)}button:disabled{opacity:.6;cursor:wait}
.links{display:flex;justify-content:space-between;gap:12px;margin-top:17px;font-size:12px}.link{color:#aab7ff;cursor:pointer}.muted{color:#697892}
.msg{min-height:20px;margin-top:13px;text-align:center;color:#98abc7;font-size:12px;line-height:1.45}.ok{color:#8dffd0!important}
.notice{margin:-7px 0 19px;padding:11px 13px;border:1px solid rgba(75,178,255,.22);border-radius:12px;background:rgba(46,139,255,.07);color:#a8c2e5;font-size:12px;line-height:1.45}
.footer{text-align:center;margin-top:22px;color:#52617a;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.hidden{display:none!important}@media(max-width:450px){.card{padding:27px 21px 22px}.pill{display:none}.names{grid-template-columns:1fr}h1{font-size:26px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="bg"></div><div class="shade"></div>
<main class="card">
<div class="logo"><div class="mark">N</div><div class="brand">NAZU</div><div class="pill">Secure access</div></div>
<div id="notice" class="notice hidden">Email verified. Finish setting up your NAZU account.</div>
<h1 id="title">Welcome back</h1>
<p id="sub" class="sub">Sign in to continue to your NAZU account.</p>

<form id="form">
<div id="names" class="names hidden">
<div><label for="first">FIRST NAME</label><input id="first" type="text" autocomplete="given-name" placeholder="First name"></div>
<div><label for="last">LAST NAME</label><input id="last" type="text" autocomplete="family-name" placeholder="Last name"></div>
</div>
<div><label for="email">EMAIL</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div>
<div id="passwordBlock"><label for="password">PASSWORD</label><input id="password" type="password" minlength="8" required autocomplete="current-password" placeholder="Your password"></div>
<div id="codeBlock" class="hidden"><label for="recoveryCode">RECOVERY CODE</label><input id="recoveryCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div>
<div id="newPasswordBlock" class="hidden">
<label for="newPassword">NEW PASSWORD</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
<label for="confirmPassword">CONFIRM PASSWORD</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Repeat your password">
</div>
<button id="submit" type="submit">Sign in</button>
</form>

<div id="msg" class="msg"></div>
<div class="links">
<span id="forgot" class="link">Forgot password?</span>
<span id="switch" class="link">Create an account</span>
</div>
<div id="back" class="links hidden"><span class="link">← Back to sign in</span></div>
<div class="footer">NAZU · Web3 network access</div>
</main>

<script>
const SUPABASE_URL="https://vjygltfnrmyghlwyjtwu.supabase.co";
const SUPABASE_KEY="sb_publishable_SL6n4Q0t_AxHywHM6iMkpg_bm-lx_Oh";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const form=document.getElementById("form"),email=document.getElementById("email"),password=document.getElementById("password");
const first=document.getElementById("first"),last=document.getElementById("last"),recoveryCode=document.getElementById("recoveryCode"),newPassword=document.getElementById("newPassword"),confirmPassword=document.getElementById("confirmPassword");
const names=document.getElementById("names"),passwordBlock=document.getElementById("passwordBlock"),codeBlock=document.getElementById("codeBlock"),newPasswordBlock=document.getElementById("newPasswordBlock");
const title=document.getElementById("title"),sub=document.getElementById("sub"),submit=document.getElementById("submit"),msg=document.getElementById("msg");
const forgot=document.getElementById("forgot"),switchBtn=document.getElementById("switch"),back=document.getElementById("back"),notice=document.getElementById("notice");

let mode="signin";
const params=new URLSearchParams(location.search);
const verified=params.get("verified")==="1";
const recovery=location.hash.includes("type=recovery");

function setMsg(t,ok=false){msg.textContent=t;msg.classList.toggle("ok",ok)}

function render(){
  const setup=mode==="setup", create=mode==="create", forgotMode=mode==="forgot", verifyCode=mode==="verifyCode", reset=mode==="reset";
  notice.classList.toggle("hidden",!setup);
  names.classList.toggle("hidden",!setup&&!create);
  passwordBlock.classList.toggle("hidden",create||setup||forgotMode||reset);
  codeBlock.classList.toggle("hidden",!verifyCode);
  newPasswordBlock.classList.toggle("hidden",!setup&&!reset);
  email.readOnly=setup||verifyCode||reset;
  first.required=setup||create;last.required=setup||create;
  password.required=mode==="signin";
  recoveryCode.required=verifyCode;
  newPassword.required=setup||reset;confirmPassword.required=setup||reset;
  if(setup){title.textContent="Finish your account";sub.textContent="Your email is verified. Create a password to activate your account.";submit.textContent="Activate account";}
  else if(create){title.textContent="Create your account";sub.textContent="Enter your details. We’ll send a verification link before activation.";submit.textContent="Send verification";}
  else if(forgotMode){title.textContent="Forgot password";sub.textContent="Enter your email and we’ll send a 6-digit recovery code.";submit.textContent="Send recovery code";}
  else if(verifyCode){title.textContent="Enter recovery code";sub.textContent="Enter the 6-digit code sent to your email.";submit.textContent="Verify code";}
  else if(reset){title.textContent="Reset your password";sub.textContent="Choose a new password for your NAZU account.";submit.textContent="Change password";}
  else{title.textContent="Welcome back";sub.textContent="Sign in to continue to your NAZU account.";submit.textContent="Sign in";}
  forgot.classList.toggle("hidden",mode!=="signin");
  switchBtn.classList.toggle("hidden",mode==="setup"||mode==="reset"||mode==="verifyCode");
  switchBtn.textContent=create?"Already have an account? Sign in":"Create an account";
  back.classList.toggle("hidden",mode!=="reset"&&mode!=="forgot"&&mode!=="verifyCode");
}

async function checkSession(){
  const {data,error}=await sb.auth.getSession();
  if(error)return;
  if(data.session&&verified){
    const u=data.session.user;
    email.value=u.email||"";
    first.value=u.user_metadata?.first_name||"";
    last.value=u.user_metadata?.last_name||"";
    mode="setup";render();return;
  }
  if(data.session&&!recovery){location.replace("dashboard.html?v=50");}
}

sb.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"){mode="reset";render();return;}
  if(event==="SIGNED_IN"&&verified&&session){
    email.value=session.user.email||"";first.value=session.user.user_metadata?.first_name||"";last.value=session.user.user_metadata?.last_name||"";
    mode="setup";render();
  }
});

switchBtn.onclick=()=>{mode=mode==="create"?"signin":"create";setMsg("");render()};
forgot.onclick=()=>{mode="forgot";setMsg("");password.value="";recoveryCode.value="";newPassword.value="";confirmPassword.value="";render()};
back.onclick=()=>{history.replaceState(null,"",location.pathname+location.search);mode="signin";setMsg("");password.value="";recoveryCode.value="";newPassword.value="";confirmPassword.value="";render()};

form.onsubmit=async e=>{
  e.preventDefault();submit.disabled=true;setMsg("");
  try{
    if(mode==="create"){
      if(!first.value.trim()||!last.value.trim())throw new Error("Please enter your first and last name.");
      const redirectTo="https://mr04nazmul.github.io/nazulabs/login.html?verified=1";
      const {error}=await sb.auth.signInWithOtp({
        email:email.value.trim(),
        options:{shouldCreateUser:true,emailRedirectTo:redirectTo,data:{first_name:first.value.trim(),last_name:last.value.trim()}}
      });
      if(error)throw error;
      setMsg("Verification email sent. Open the link to continue. Your account is not activated until you verify your email.",true);
      submit.textContent="Verification sent";
      return;
    }

    if(mode==="signin"){
      const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
      if(error)throw error;
      if(!data.session)throw new Error("Sign in could not be completed.");
      location.replace("dashboard.html?v=50");return;
    }

    if(mode==="forgot"){
      const {error}=await sb.auth.signInWithOtp({email:email.value.trim(),options:{shouldCreateUser:false}});
      if(error)throw error;
      mode="verifyCode";setMsg("Recovery code sent. Check your Gmail inbox.",true);render();return;
    }

    if(mode==="verifyCode"){
      if(!/^\\d{6}$/.test(recoveryCode.value.trim()))throw new Error("Enter the 6-digit recovery code.");
      const {error}=await sb.auth.verifyOtp({email:email.value.trim(),token:recoveryCode.value.trim(),type:"email"});
      if(error)throw error;
      mode="reset";recoveryCode.value="";setMsg("Code verified. Choose a new password.",true);render();return;
    }

    if(mode==="reset"){
      if(newPassword.value.length<8)throw new Error("Password must be at least 8 characters.");
      if(newPassword.value!==confirmPassword.value)throw new Error("Passwords do not match.");
      const {error}=await sb.auth.updateUser({password:newPassword.value});
      if(error)throw error;
      await sb.auth.signOut();history.replaceState(null,"",location.pathname);
      mode="signin";setMsg("Password changed. You can now sign in.",true);render();return;
    }

    if(mode==="setup"){
      if(!first.value.trim()||!last.value.trim())throw new Error("Please enter your first and last name.");
      if(newPassword.value.length<8)throw new Error("Password must be at least 8 characters.");
      if(newPassword.value!==confirmPassword.value)throw new Error("Passwords do not match.");
      const {error}=await sb.auth.updateUser({password:newPassword.value,data:{first_name:first.value.trim(),last_name:last.value.trim()}});
      if(error)throw error;
      setMsg("Account activated. Opening NAZU…",true);
      setTimeout(()=>location.replace("dashboard.html?v=50"),450);
    }
  }catch(err){setMsg(err?.message||"Something went wrong. Please try again.");}
  finally{submit.disabled=false;}
};

render();checkSession();
</script>
</body>
</html>
