<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAZU | Sign in</title>
<style>body{margin:0;background:#070b14;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(390px,90%);padding:28px;border:1px solid #252d40;border-radius:18px;background:#0d1320}input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0 14px;border-radius:9px;border:1px solid #30394e;background:#070b14;color:#fff}button{width:100%;padding:14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.link{display:block;text-align:center;margin-top:18px;color:#9dbbff}#msg{margin-top:14px;color:#aab4c5;font-size:13px}</style></head>
<body><div class="box"><h2>NAZU</h2><p>Sign in to your account</p><form id="form"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><div id="msg"></div><a class="link" href="index.html">← Back</a></div>
<script>
const API="https://jenny-last-try.onrender.com";
const form=document.getElementById("form"),email=document.getElementById("email"),password=document.getElementById("password"),msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Signing in...";
try{const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.message||"Login failed");localStorage.setItem("nazu_token",d.token);location.href="dashboard.html"}catch(err){msg.textContent=err.message||"Unable to connect to the server."}});
</script></body></html>
