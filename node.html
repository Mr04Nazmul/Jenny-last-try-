<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAZORIX | Node Center</title>
<style>
body{margin:0;background:#050608;color:#f5f7fb;font-family:Inter,system-ui,sans-serif;min-height:100vh}nav{height:72px;border-bottom:1px solid #202631;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:900;letter-spacing:.22em}.back{color:#8993a2;text-decoration:none;font-size:11px}.wrap{width:min(720px,92%);margin:auto;padding:70px 0}.k{font-size:9px;letter-spacing:.2em;color:#687382}.title{font-size:clamp(44px,8vw,76px);letter-spacing:-.06em;margin:12px 0 45px}.title em{font-style:normal;color:#65e6ff}.node{border:1px solid #202631;border-radius:24px;padding:30px;background:linear-gradient(145deg,#0e141a,#080a0e)}.status{color:#788392;font-size:10px;letter-spacing:.13em}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4b5360;margin-right:8px}.dot.on{background:#b8ff72;box-shadow:0 0 14px #b8ff72}.timer{font-size:clamp(58px,13vw,110px);font-weight:850;letter-spacing:-.07em;margin:35px 0 8px}.earned{color:#667180;font-size:11px}.earned b{color:#b8ff72}.btn{width:100%;margin-top:35px;padding:16px;border-radius:12px;border:1px solid #34404b;background:#10161d;color:#e8edf3;font-weight:800}.note{text-align:center;color:#596472;font-size:10px;line-height:1.7;margin-top:22px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><nav><div class="brand">NAZORIX</div><a class="back" href="dashboard.html">← DASHBOARD</a></nav>
<main class="wrap"><div class="k">NETWORK / NODE CENTER</div><h1 class="title">Run your <em>node.</em></h1>
<section class="node"><div class="status"><i id="dot" class="dot"></i><span id="status">NODE OFFLINE</span></div><div class="timer" id="timer">00:00:00</div><div class="earned">SESSION UPTIME · <b id="points">0 PTS</b></div><button class="btn" id="btn" onclick="toggleNode()">START NODE</button><div class="note">Uptime points are recorded to your NAZORIX account.</div></section></main>
<script>
const sb=supabase.createClient("https://vjygltfnrmyghlwyjtwu.supabase.co","sb_publishable_SL6n4Q0t_AxHywHM6iMkpg_bm-lx_Oh");let active=false,sec=0,timer=null;
async function load(){const {data,error}=await sb.auth.getUser();if(error||!data.user){location.replace("login.html");return}const {data:n}=await sb.from("node_sessions").select("active,total_seconds").eq("user_id",data.user.id).maybeSingle();if(n&&n.active){active=true;sec=n.total_seconds||0;ui();start()}else ui()}
function ui(){document.getElementById("status").textContent=active?"NODE ACTIVE · EARNING":"NODE OFFLINE";document.getElementById("dot").className="dot"+(active?" on":"");document.getElementById("btn").textContent=active?"STOP NODE":"START NODE";document.getElementById("timer").textContent=new Date(sec*1000).toISOString().slice(11,19)}
function start(){if(timer)return;timer=setInterval(async()=>{if(!active)return;sec++;ui();if(sec%30===0){const {data}=await sb.rpc("node_heartbeat");if(!data||!data.active){active=false;clearInterval(timer);timer=null;ui()}}},1000)}
async function toggleNode(){if(active){const {error}=await sb.rpc("node_stop");if(error){alert("Could not stop node.");return}active=false;clearInterval(timer);timer=null;ui();return}const {error}=await sb.rpc("node_start");if(error){alert("Could not start node.");return}active=true;sec=0;ui();start()}load();
</script></body></html>
